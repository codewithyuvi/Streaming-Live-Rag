# Streaming Live RAG — Labeled Evaluation Dataset (v2)
#
# Machine-readable scenarios for gates G2..G5. Every expectation the gates
# assert on lives in these fields — nothing is hidden in YAML comments.
#
# Sections:
#   streaming_early_retrieval  (G2)  full utterance replayed live via
#                                    play_utterance(); controller decisions
#                                    and provisional timing are measured.
#   late_detail                (G5)  two-turn session: base question, then a
#                                    late-arriving constraint in the same
#                                    session. Expects answer_version 1 -> 2.
#   suppression                (G5)  presentation-only follow-up: expects
#                                    retrieval_required == false, no new cites.
#   chit_chat                  (G2)  false-trigger controls: no provisional.
#   multi_intent               (G3)  compound queries with keyword intent sets.
#   grounding_probes           (G4)  real turns whose synthesis output is
#                                    validated (answerable + abstain probe).

meta:
  version: 2
  description: "Streaming Live RAG eval dataset. Expectations are machine-readable; comments carry no labels."
  gates: ["G2", "G3", "G4", "G5"]

# ─── G2: early retrieval — organizer's worked example + variants ────────────
streaming_early_retrieval:
  - id: ser_01
    # Organizer Theme 4 guide, Section 4, Example 1 (exact wording).
    utterance: "I need to plan a customer workshop in Pune for 30 people, and I need the cancellation policy and the catering options."
    words_per_chunk: 2
    ms_per_chunk: 50
    expected:
      early_retrieval: true
      wait_chunk_contains: "I need to plan a customer"
      wait_trigger: "wait"
      retrieve_chunk_contains: "Pune for 30 people"
      retrieve_trigger: "retrieve_now"
      retrieval_triggers: ["provisional", "multi_intent"]

  - id: ser_02
    utterance: "I need to book international flights for the Pune workshop and I need to know the approval process and the advance booking rule."
    words_per_chunk: 2
    ms_per_chunk: 50
    expected:
      early_retrieval: true
      wait_chunk_contains: "I need to book"
      wait_trigger: "wait"
      retrieve_chunk_contains: "book international flights"
      retrieve_trigger: "retrieve_now"
      retrieval_triggers: ["provisional", "multi_intent"]

  - id: ser_03
    utterance: "I was wondering about the approval process for international travel and the hotel booking deadline for the trip."
    words_per_chunk: 2
    ms_per_chunk: 50
    expected:
      early_retrieval: true
      wait_chunk_contains: "I was wondering about"
      wait_trigger: "wait"
      retrieve_chunk_contains: "approval process for international travel"
      retrieve_trigger: "retrieve_now"
      retrieval_triggers: ["provisional", "multi_intent"]

# ─── G5: late-arriving detail — two turns, one session ─────────────────────
late_detail:
  - id: ld_01
    # Organizer Theme 4 guide, Section 4, Example 2.
    turns:
      - "Summarize the travel-reimbursement rule for an employee trip."
      - "The trip was international and the booking was made after travel."
    words_per_chunk: 3
    ms_per_chunk: 50
    expected:
      answer_versions: [1, 2]
      turn1_citations_preserved: true
      no_session_reset: true
      delta_keywords: ["international", "after travel", "late-booking", "booking"]

# ─── G5: presentation-only suppression ─────────────────────────────────────
suppression:
  - id: sup_01
    # Organizer Theme 4 guide, Section 4, Example 3.
    setup_utterance: "What is the cancellation policy for the Pune venue?"
    utterance: "Please repeat your last answer in two bullets."
    words_per_chunk: 3
    ms_per_chunk: 50
    expected:
      retrieval_required: false
      retrieval_skip_reason: "presentation_restructure"
      no_new_citations: true

# ─── G2: chit-chat false-trigger controls ──────────────────────────────────
chit_chat:
  - id: cc_01
    utterance: "Hello, how are you today?"
    words_per_chunk: 2
    ms_per_chunk: 50
    expected:
      retrieval_required: false
      provisional_fired: false
  - id: cc_02
    utterance: "Good morning, can you hear me all right?"
    words_per_chunk: 2
    ms_per_chunk: 50
    expected:
      retrieval_required: false
      provisional_fired: false
  - id: cc_03
    utterance: "Thanks for joining the call today."
    words_per_chunk: 2
    ms_per_chunk: 50
    expected:
      retrieval_required: false
      provisional_fired: false

# ─── G3: multi-intent decomposition ────────────────────────────────────────
# A sub-query matches an intent if it contains >= 1 keyword from the set
# (case-insensitive). A scenario passes when >= 2 distinct intent sets match.
multi_intent:
  - id: mi_01
    utterance: "What is the cancellation policy for venues and what are the rules for late flight bookings?"
    expected_intent_keywords:
      - ["cancellation", "cancel", "refund", "penalty"]
      - ["flight", "booking", "late-booking", "travel"]

  - id: mi_02
    utterance: "Tell me about standing room in the Pune venue and whether VP sign-off is needed for emergencies."
    expected_intent_keywords:
      - ["standing room", "capacity", "venue", "pune"]
      - ["vp", "sign-off", "approval", "emergencies", "emergency"]

  - id: mi_03
    utterance: "How many people can fit in the workshop and how many days before do I need to book flights?"
    expected_intent_keywords:
      - ["capacity", "people", "fit", "attendees", "workshop"]
      - ["book", "days", "advance", "flights", "flight"]

  - id: mi_04
    utterance: "What is the venue capacity, what is the cancellation penalty, and who approves international travel?"
    expected_intent_keywords:
      - ["capacity", "venue"]
      - ["cancellation", "penalty", "cancel"]
      - ["approves", "approval", "international travel", "director"]

  - id: mi_05
    utterance: "I need to know the refund rules for venue cancellation and also the travel reimbursement approval process."
    expected_intent_keywords:
      - ["refund", "cancellation", "cancel", "venue"]
      - ["reimbursement", "approval", "travel"]

  - id: mi_06
    utterance: "Before I book everything, I want to confirm the maximum attendees for Pune, the cancellation penalty percentage, and the advance booking days for flights."
    expected_intent_keywords:
      - ["attendees", "capacity", "maximum", "pune"]
      - ["cancellation", "penalty"]
      - ["advance booking", "booking days", "flights"]

# ─── G4: grounding probes — real synthesis output is validated ─────────────
grounding_probes:
  - id: gp_01
    utterance: "What is the maximum capacity of the Pune workshop venue?"
    words_per_chunk: 3
    ms_per_chunk: 50
    expect_abstain: false
  - id: gp_02
    utterance: "What is the cancellation policy for the Pune venue?"
    words_per_chunk: 3
    ms_per_chunk: 50
    expect_abstain: false
  - id: gp_03
    utterance: "Who needs to approve international travel?"
    words_per_chunk: 3
    ms_per_chunk: 50
    expect_abstain: false
  - id: gp_04
    utterance: "What is the hotel reimbursement limit for international trips?"
    words_per_chunk: 3
    ms_per_chunk: 50
    expect_abstain: true
