    expected_doc: "Doc_01"
    expected_intents: 1

  # ─── Phase 5: Late-Detail / Refinement Cases (q32 – q42) ──────────────
  # These test the refinement classifier. They simulate multi-turn conversations
  # where a prior turn provides context.

  # Late-detail: adds constraint to previous venue query
  - id: q32
    utterance: "What is the capacity of the Pune venue?"
    expected_doc: "Doc_01"
    refinement_type: "NEW_TOPIC"
    prior_utterance: null

  - id: q33
    utterance: "And what about the cancellation penalty?"
    expected_doc: "Doc_01"
    refinement_type: "LATE_DETAIL"
    prior_utterance: "What is the capacity of the Pune venue?"

  - id: q34
    utterance: "Actually, I meant if we cancel within 24 hours"
    expected_doc: "Doc_01"
    refinement_type: "LATE_DETAIL"
    prior_utterance: "What is the cancellation policy?"

  - id: q35
    utterance: "Wait, the trip was international, not domestic"
    expected_doc: "Doc_02"
    refinement_type: "LATE_DETAIL"
    prior_utterance: "Who approves domestic flights?"

  - id: q36
    utterance: "What if there are more than 30 people?"
    expected_doc: "Doc_01"
    refinement_type: "LATE_DETAIL"
    prior_utterance: "What is the maximum capacity of the Pune workshop venue?"

  - id: q37
