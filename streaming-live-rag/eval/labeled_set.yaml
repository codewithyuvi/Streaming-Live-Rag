    expected_doc: "Doc_02"
    refinement_type: "LATE_DETAIL"
    prior_utterance: "How far in advance do I need to book flights?"

  # New topic after a prior conversation (not a refinement)
  - id: q39
    utterance: "Now tell me about the travel reimbursement process."
    expected_doc: "Doc_02"
    refinement_type: "NEW_TOPIC"
    prior_utterance: "What is the capacity of the Pune venue?"

  - id: q40
    utterance: "Switching gears — what's the venue cancellation policy?"
    expected_doc: "Doc_01"
    refinement_type: "NEW_TOPIC"
    prior_utterance: "Who approves international flights?"

  - id: q41
    utterance: "Can I also ask about hotel booking deadlines?"
    expected_doc: "Doc_02"
    refinement_type: "NEW_TOPIC"
    prior_utterance: "What is the cancellation penalty for venues?"

  - id: q42
    utterance: "One more thing — is standing room allowed?"
    expected_doc: "Doc_01"
    refinement_type: "LATE_DETAIL"
    prior_utterance: "How many people fit in the Pune venue?"

