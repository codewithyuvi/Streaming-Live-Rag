  # Compound with one unanswerable sub-intent
  - id: q29
    utterance: "What is the Pune venue capacity and what is the parking situation there?"
    expected_doc: "Doc_01"
    expected_intents: 2

  - id: q30
    utterance: "Can you explain the travel reimbursement process and also the meal allowance policy?"
    expected_doc: "Doc_02"
    expected_intents: 2

