[project]
name = "streaming-live-rag"
version = "0.1.0"
description = "Samsung PRISM GenAI Hackathon 2026-27 - Theme 4 - Streaming Live RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "qdrant-client[fastembed]>=1.9.0",
    "fastembed>=0.3.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.3.0",
    "groq>=0.9.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "striprtf>=0.0.26",
    "python-multipart>=0.0.9",
    "httpx>=0.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
