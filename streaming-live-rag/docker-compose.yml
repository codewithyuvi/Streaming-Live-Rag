services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ingest:
    build: .
    command: python retrieval/ingest.py
    environment:
      - QDRANT_URL=http://qdrant:6333
      - COLLECTION_NAME=dev_corpus_dense
    depends_on:
      qdrant:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - COLLECTION_NAME=dev_corpus_dense
      - FAST_LLM_MODEL=${FAST_LLM_MODEL:-openai/gpt-oss-20b}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SYNTHESIS_LLM_MODEL=${SYNTHESIS_LLM_MODEL:-gemini-3.8-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  qdrant_data:
